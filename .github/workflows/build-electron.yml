name: Build Desktop App (Electron + Python Backend)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-desktop:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Python Backend Binary with PyInstaller
        working-directory: ./backend
        run: |
          pyinstaller analyzer.spec

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: webapp/package-lock.json

      - name: Install WebApp & Electron Dependencies
        working-directory: ./webapp
        run: |
          npm ci

      - name: Build WebApp Assets
        working-directory: ./webapp
        run: |
          npm run build

      - name: Package Desktop App with Electron Builder
        working-directory: ./webapp
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx electron-builder --win --publish never

      - name: Upload Desktop Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Microcirculation-Desktop-Suite-Installer
          path: webapp/release/*.*
          if-no-files-found: warn
          retention-days: 30

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            webapp/release/*.exe
            webapp/release/*.blockmap
          draft: false
          prerelease: false
          generate_release_notes: true
